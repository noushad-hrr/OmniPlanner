<div class="timer-stopwatch-container">
  <!-- Mode Toggle -->
  <div class="mode-toggle">
    <button 
      class="mode-btn" 
      [class.active]="mode === 'stopwatch'"
      (click)="toggleMode()">
      <i class="fas fa-stopwatch"></i>
      <span>Stopwatch</span>
    </button>
    <button 
      class="mode-btn" 
      [class.active]="mode === 'timer'"
      (click)="toggleMode()">
      <i class="fas fa-clock"></i>
      <span>Timer</span>
    </button>
  </div>

  <!-- Main Display -->
  <div class="time-display">
    <div class="time-value" [class.running]="isRunning">
      {{ formatTime(time) }}
    </div>
    <div class="time-label">
      {{ mode === 'stopwatch' ? 'Elapsed Time' : 'Remaining Time' }}
    </div>
  </div>

  <!-- Timer Setup (only in timer mode) -->
  <div class="timer-setup" *ngIf="mode === 'timer'">
    <div class="timer-inputs">
      <div class="time-input-group">
        <label>Hours</label>
        <input 
          type="number" 
          [(ngModel)]="timerHours" 
          [disabled]="isRunning"
          min="0" 
          max="99"
          (change)="setTimer()"
          class="time-input">
      </div>
      <div class="time-input-group">
        <label>Minutes</label>
        <input 
          type="number" 
          [(ngModel)]="timerMinutes" 
          [disabled]="isRunning"
          min="0" 
          max="59"
          (change)="setTimer()"
          class="time-input">
      </div>
      <div class="time-input-group">
        <label>Seconds</label>
        <input 
          type="number" 
          [(ngModel)]="timerSeconds" 
          [disabled]="isRunning"
          min="0" 
          max="59"
          (change)="setTimer()"
          class="time-input">
      </div>
    </div>
    
    <!-- Preset Buttons -->
    <div class="presets">
      <div class="presets-label">Quick Set:</div>
      <div class="preset-buttons">
        <button 
          *ngFor="let preset of presets"
          class="preset-btn"
          [disabled]="isRunning"
          (click)="usePreset(preset)">
          {{ preset }}m
        </button>
      </div>
    </div>
  </div>

  <!-- Control Buttons -->
  <div class="controls">
    <button 
      *ngIf="!isRunning"
      class="control-btn start-btn"
      (click)="start()"
      [disabled]="mode === 'timer' && getTimerTotalTime() === 0">
      <i class="fas fa-play"></i>
      <span>Start</span>
    </button>
    <button 
      *ngIf="isRunning"
      class="control-btn pause-btn"
      (click)="pause()">
      <i class="fas fa-pause"></i>
      <span>Pause</span>
    </button>
    <button 
      class="control-btn reset-btn"
      (click)="reset()"
      [disabled]="time === 0 && laps.length === 0">
      <i class="fas fa-redo"></i>
      <span>Reset</span>
    </button>
    <button 
      *ngIf="mode === 'stopwatch' && isRunning"
      class="control-btn lap-btn"
      (click)="addLap()">
      <i class="fas fa-flag"></i>
      <span>Lap</span>
    </button>
  </div>

  <!-- Laps Section (Stopwatch only) -->
  <div class="laps-section" *ngIf="mode === 'stopwatch' && laps.length > 0">
    <div class="laps-header">
      <h3 class="laps-title">Laps</h3>
      <div class="laps-actions">
        <button class="laps-action-btn" (click)="exportLaps()" title="Export to CSV">
          <i class="fas fa-download"></i>
        </button>
        <button class="laps-action-btn" (click)="clearLaps()" title="Clear all laps">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>
    
    <div class="laps-list">
      <div 
        class="lap-item" 
        *ngFor="let lap of laps; let i = index"
        [class.fastest]="getFastestLap()?.id === lap.id"
        [class.slowest]="getSlowestLap()?.id === lap.id">
        <div class="lap-number">{{ laps.length - i }}</div>
        <div class="lap-time">{{ formatLapTime(lap.time) }}</div>
        <div class="lap-difference" *ngIf="i > 0">
          +{{ formatLapTime(lap.time - laps[i - 1].time) }}
        </div>
        <div class="lap-badges">
          <span class="badge fastest-badge" *ngIf="getFastestLap()?.id === lap.id">Fastest</span>
          <span class="badge slowest-badge" *ngIf="getSlowestLap()?.id === lap.id">Slowest</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div class="settings-section">
    <div class="setting-item">
      <label class="setting-label">
        <input 
          type="checkbox" 
          [(ngModel)]="soundEnabled"
          class="setting-checkbox">
        <span>Sound Alerts</span>
      </label>
    </div>
    <div class="setting-item">
      <label class="setting-label">
        <input 
          type="checkbox" 
          [(ngModel)]="notificationEnabled"
          class="setting-checkbox">
        <span>Desktop Notifications</span>
      </label>
    </div>
    
    <!-- Tone Selection -->
    <div class="setting-item tone-selection">
      <label class="setting-label">Notification Tone</label>
      <select class="tone-select" [(ngModel)]="selectedTone">
        <option *ngFor="let tone of availableTones" [value]="tone.value">
          {{ tone.label }}
        </option>
      </select>
    </div>
    
    <!-- Custom Message -->
    <div class="setting-item custom-message">
      <label class="setting-label">Custom Notification Message</label>
      <input 
        type="text" 
        class="message-input"
        [(ngModel)]="customMessage"
        placeholder="Leave empty for default message">
    </div>
  </div>
</div>
