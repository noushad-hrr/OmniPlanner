<div class="category-master-container">
  <!-- Search and Add Button Row -->
  <div class="master-toolbar" *ngIf="tableConfig.searchable">
    <div class="master-search-wrapper">
      <input 
        type="text" 
        class="master-search-input" 
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange()"
        placeholder="Search priorities..."
      />
      <button 
        *ngIf="searchQuery" 
        class="master-search-clear"
        (click)="searchQuery = ''; onSearchChange()"
        title="Clear search"
      >
        <i class="fas fa-times"></i>
      </button>
    </div>
    <button 
      class="add-action-btn" 
      (click)="openAddModal()"
      aria-label="Add new priority"
      title="Create a new priority"
    >
      <i class="fas fa-plus icon" [attr.aria-hidden]="true"></i>
      <span class="label">Add Priority</span>
    </button>
  </div>

  <div class="table-view">
    <app-data-table
      [columns]="tableColumns"
      [data]="getTableData()"
      [config]="tableConfig"
      [actions]="tableActions"
      [loading]="false"
      emptyMessage="No priorities available"
      searchPlaceholder="Search priorities..."
      [externalSearch]="searchQuery"
      (actionClick)="onTableActionClick($event)"
      (booleanToggle)="onBooleanToggle($event)"
    ></app-data-table>
  </div>

  <div class="modal-overlay" *ngIf="showAddEditModal" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ isEditMode ? 'Edit Priority' : 'Add New Priority' }}</h3>
        <button class="btn-icon" (click)="closeModal()" title="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="priorityName">Priority Name <span class="required">*</span></label>
          <input 
            type="text" 
            id="priorityName"
            class="form-input" 
            [class.error]="priorityError"
            [(ngModel)]="formPriority.priority"
            (blur)="onPriorityBlur()"
            (input)="onPriorityInput()"
            placeholder="e.g., High"
            maxlength="100"
          />
          <div class="error-message" *ngIf="priorityError">{{ priorityError }}</div>
        </div>

        <div class="form-group">
          <label for="priorityColor">Color <span class="required">*</span></label>
          <div style="display:flex; gap:8px; align-items:center;">
            <input type="color" [(ngModel)]="formPriority.color" (ngModelChange)="onColorInput()" style="width:42px; height:38px; background:transparent; border:1px solid #2a2f36; border-radius:6px; padding:0;"/>
            <input 
              type="text" 
              id="priorityColor"
              class="form-input" 
              [class.error]="colorError"
              [(ngModel)]="formPriority.color"
              (blur)="validateColor()"
              (input)="onColorInput()"
              placeholder="#DC2626"
              maxlength="7"
            />
          </div>
          <div class="error-message" *ngIf="colorError">{{ colorError }}</div>
        </div>

        <div class="form-group form-group-checkbox">
          <label for="priorityDefault" class="form-label-inline">Default</label>
          <label class="checkbox-label">
            <input 
              type="checkbox" 
              id="priorityDefault"
              [(ngModel)]="formPriority.is_default"
              (change)="onDefaultChange()"
              class="checkbox-input"
            />
            <span class="checkbox-toggle">
              <span class="toggle-indicator"></span>
            </span>
          </label>
          <small class="form-hint" *ngIf="formPriority.is_default">Only one priority can be set as default. Setting this as default will unset any other default priority.</small>
        </div>

        <div class="form-group form-group-checkbox">
          <label for="priorityActive" class="form-label-inline">Active</label>
          <label class="checkbox-label">
            <input 
              type="checkbox" 
              id="priorityActive"
              [(ngModel)]="formPriority.is_active"
              class="checkbox-input"
            />
            <span class="checkbox-toggle">
              <span class="toggle-indicator"></span>
            </span>
          </label>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        <button class="btn btn-primary" (click)="savePriority()">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </div>
  </div>
</div>
