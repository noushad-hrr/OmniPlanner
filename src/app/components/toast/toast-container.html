<div class="toast-container">
  <div class="toast" *ngFor="let m of (toaster.messages$ | async)" [class]="'toast ' + m.type">
    <span class="dot"></span>
    <span class="text">{{ m.text }}</span>
    <button class="close" (click)="toaster.dismiss(m.id)" aria-label="Close">×</button>
  </div>
  <div class="spacer" aria-hidden="true"></div>
</div>
