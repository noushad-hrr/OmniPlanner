<div class="login-container">
  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <h1 class="login-title">Welcome back</h1>
      <p class="login-subtitle">Sign in to your account</p>
    </div>

    <!-- Email Input Section -->
    <div class="email-section">
      <div class="input-group">
        <input 
          type="email" 
          class="email-input" 
          placeholder="username@gmail.com"
          [(ngModel)]="email"
          (keyup.enter)="onEmailSubmit()">
        <button 
          class="submit-btn" 
          (click)="onEmailSubmit()"
          [disabled]="isLoading || !email.trim()">
          <i class="fas fa-arrow-right" *ngIf="!isLoading"></i>
          <i class="fas fa-spinner fa-spin" *ngIf="isLoading"></i>
        </button>
      </div>
    </div>

    <!-- OR Separator -->
    <div class="separator">
      <div class="separator-line"></div>
      <span class="separator-text">OR</span>
      <div class="separator-line"></div>
    </div>

    <!-- Social Login Buttons -->
    <div class="social-login">
      <button class="social-btn google-btn" (click)="onGoogleLogin()" [disabled]="isLoading">
        <div class="social-icon google-icon">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
        </div>
        <span class="social-text">Continue with Google</span>
        <i class="fas fa-arrow-right social-arrow"></i>
      </button>

      <button class="social-btn x-btn" (click)="onXLogin()" [disabled]="isLoading">
        <div class="social-icon x-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </div>
        <span class="social-text">Continue with X</span>
        <i class="fas fa-arrow-right social-arrow"></i>
      </button>
    </div>

    <!-- Sign Up Link -->
    <div class="signup-link">
      <span class="signup-text">Don't have an account?</span>
      <button class="signup-btn" (click)="onSignUp()">Sign up</button>
    </div>
  </div>
</div>
