<div class="category-master-container">
  <!-- Search and Add Button Row -->
  <div class="master-toolbar" *ngIf="tableConfig.searchable">
    <div class="master-search-wrapper">
      <input 
        type="text" 
        class="master-search-input" 
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange()"
        placeholder="Search credentials..."
      />
      <button 
        *ngIf="searchQuery" 
        class="master-search-clear"
        (click)="searchQuery = ''; onSearchChange()"
        title="Clear search"
      >
        <i class="fas fa-times"></i>
      </button>
    </div>
    <button 
      class="add-action-btn" 
      (click)="openAddModal()"
      aria-label="Add new credential"
      title="Create a new credential"
    >
      <i class="fas fa-plus icon" [attr.aria-hidden]="true"></i>
      <span class="label">Add Credential</span>
    </button>
  </div>

  <!-- Table View -->
  <div class="table-view">
    <app-data-table
      [columns]="tableColumns"
      [data]="getTableData()"
      [config]="tableConfig"
      [actions]="tableActions"
      [loading]="false"
      emptyMessage="No credentials available"
      searchPlaceholder="Search credentials..."
      [externalSearch]="searchQuery"
      (rowClick)="onTableRowClick($event)"
      (actionClick)="onTableActionClick($event)"
      (booleanToggle)="onBooleanToggle($event)"
      (sortChange)="onTableSortChange($event)"
      (filterChange)="onTableFilterChange($event)"
      (pageChange)="onTablePageChange($event)"
    ></app-data-table>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" *ngIf="showAddEditModal" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ isEditMode ? 'Edit Credential' : 'Add New Credential' }}</h3>
        <button class="btn-icon" (click)="closeModal()" title="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="credentialProvider">Provider <span class="required">*</span></label>
          <input 
            type="text" 
            id="credentialProvider"
            class="form-input" 
            [class.error]="providerError"
            [(ngModel)]="formCredential.provider"
            (input)="onInput('provider')"
            placeholder="e.g., Google Drive, AWS, GitHub"
            maxlength="200"
          />
          <div class="error-message" *ngIf="providerError">{{ providerError }}</div>
        </div>

        <div class="form-group">
          <label for="credentialName">Credential Name <span class="required">*</span></label>
          <input 
            type="text" 
            id="credentialName"
            class="form-input" 
            [class.error]="credentialNameError"
            [(ngModel)]="formCredential.credential_name"
            (input)="onInput('credential_name')"
            placeholder="e.g., Personal Gmail, Work Account"
            maxlength="200"
          />
          <div class="error-message" *ngIf="credentialNameError">{{ credentialNameError }}</div>
        </div>

        <div class="form-group">
          <label for="credentialId">Credential ID <span class="required">*</span></label>
          <input 
            type="text" 
            id="credentialId"
            class="form-input" 
            [class.error]="credentialIdError"
            [(ngModel)]="formCredential.credential_id"
            (blur)="onCredentialIdBlur()"
            (input)="onInput('credential_id')"
            placeholder="e.g., user@gmail.com"
            maxlength="500"
          />
          <div class="error-message" *ngIf="credentialIdError">{{ credentialIdError }}</div>
        </div>

        <div class="form-group">
          <label for="credentialPassword">Password <span class="required">*</span></label>
          <div class="password-input-wrapper">
            <input 
              [type]="showPassword ? 'text' : 'password'"
              id="credentialPassword"
              class="form-input" 
              [class.error]="passwordError"
              [(ngModel)]="formCredential.credential_password"
              (blur)="onPasswordBlur()"
              (input)="onInput('password')"
              placeholder="Enter password"
            />
            <button 
              type="button"
              class="password-toggle-btn-form"
              (click)="showPassword = !showPassword"
              [title]="showPassword ? 'Hide password' : 'Show password'"
            >
              <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
            </button>
          </div>
          <div class="error-message" *ngIf="passwordError">{{ passwordError }}</div>
        </div>

        <div class="form-group">
          <label for="credentialNotes">Notes</label>
          <textarea 
            id="credentialNotes"
            class="form-input" 
            [(ngModel)]="formCredential.notes"
            placeholder="Optional notes"
            rows="3"
          ></textarea>
        </div>

        <div class="form-group">
          <label>Additional Fields (Key-Value Pairs)</label>
          <div class="additional-fields-container">
            <div class="additional-fields-list">
              <div *ngFor="let key of getAdditionalFieldsKeys(); let i = index" class="additional-field-row">
                <input 
                  type="text" 
                  class="form-input field-key"
                  [ngModel]="tempKeyValues[key] !== undefined ? tempKeyValues[key] : key"
                  (ngModelChange)="updateAdditionalFieldKey(key, $event, i)"
                  placeholder="Field name (e.g., Host, Port, Key)"
                  (blur)="onAdditionalFieldKeyBlur(key)"
                />
                <input 
                  type="text" 
                  class="form-input field-value"
                  [class.error]="additionalFieldErrors[key]"
                  [(ngModel)]="additionalFieldsJson[key]"
                  placeholder="Field value"
                  (blur)="validateAdditionalFieldValue(key)"
                  (input)="onAdditionalFieldValueInput(key)"
                />
                <div class="field-error" *ngIf="additionalFieldErrors[key]">{{ additionalFieldErrors[key] }}</div>
                <button 
                  class="btn-icon btn-remove-field"
                  (click)="removeAdditionalField(key)"
                  title="Remove field"
                >
                  <i class="fas fa-times"></i>
                </button>
              </div>
            </div>
            <button 
              type="button"
              class="btn btn-secondary btn-sm"
              (click)="addAdditionalField()"
            >
              <i class="fas fa-plus"></i> Add Field
            </button>
          </div>
          <div class="error-message" *ngIf="additionalFieldsError">{{ additionalFieldsError }}</div>
        </div>

        <div class="form-group form-group-checkbox">
          <label for="credentialActive" class="form-label-inline">Active</label>
          <label class="checkbox-label">
            <input 
              type="checkbox" 
              id="credentialActive"
              [(ngModel)]="formCredential.is_active"
              class="checkbox-input"
            />
            <span class="checkbox-toggle">
              <span class="toggle-indicator"></span>
            </span>
          </label>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        <button class="btn btn-primary" (click)="saveCredential()">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </div>
  </div>
</div>
