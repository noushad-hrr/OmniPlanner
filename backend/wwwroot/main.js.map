<div class="confirmation-overlay" *ngIf="show" (click)="onBackdropClick($event)">
  <div class="confirmation-dialog">
    <div class="dialog-header">
      <h3 class="dialog-title">{{ title }}</h3>
    </div>
    <div class="dialog-body">
      <p class="dialog-message">{{ message }}</p>
    </div>
    <div class="dialog-footer">
      <button class="btn btn-cancel" (click)="onCancel()">{{ cancelText }}</button>
      <button class="btn" [class]="'btn-confirm btn-' + confirmClass" (click)="onConfirm()">{{ confirmText }}</button>
    </div>
  </div>
</div>
