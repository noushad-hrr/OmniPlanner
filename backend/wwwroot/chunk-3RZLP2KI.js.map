<div class="permission-management-container">
  <!-- Search and Add Button Row -->
  <div class="master-toolbar" *ngIf="tableConfig.searchable">
    <div class="master-search-wrapper">
      <input 
        type="text" 
        class="master-search-input" 
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange()"
        placeholder="Search permissions..."
      />
      <button 
        *ngIf="searchQuery" 
        class="master-search-clear"
        (click)="searchQuery = ''; onSearchChange()"
        title="Clear search"
      >
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="toolbar-right">
      <div class="module-filter-wrapper" [class.has-selection]="selectedModule !== 'all'">
        <i class="fas fa-filter module-filter-icon"></i>
        <select 
          class="module-filter-select"
          [(ngModel)]="selectedModule"
          (ngModelChange)="onModuleChange()"
          id="moduleFilter"
        >
          <option value="all">All Modules</option>
          <option *ngFor="let module of modules" [value]="module">{{ module }}</option>
        </select>
        <i class="fas fa-chevron-down module-filter-arrow"></i>
      </div>
      <button 
        *appHasPermission="'permissions.manage'"
        class="add-action-btn" 
        (click)="openAddModal()"
        aria-label="Add new permission"
        title="Create a new permission"
      >
        <i class="fas fa-plus icon" [attr.aria-hidden]="true"></i>
        <span class="label">Add Permission</span>
      </button>
    </div>
  </div>

  <!-- Table View -->
  <div class="table-view">
    <app-data-table
      [columns]="tableColumns"
      [data]="getTableData()"
      [config]="tableConfig"
      [actions]="tableActions"
      [loading]="false"
      emptyMessage="No permissions available"
      searchPlaceholder="Search permissions..."
      [externalSearch]="searchQuery"
      (rowClick)="onTableRowClick($event)"
      (actionClick)="onTableActionClick($event)"
      (sortChange)="onTableSortChange($event)"
      (filterChange)="onTableFilterChange($event)"
      (pageChange)="onTablePageChange($event)"
    ></app-data-table>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" *ngIf="showAddEditModal" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ isEditMode ? 'Edit Permission' : 'Add New Permission' }}</h3>
        <button class="btn-icon" (click)="closeModal()" title="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="permissionName">Permission Name <span class="required">*</span></label>
          <input 
            type="text" 
            id="permissionName"
            class="form-input" 
            [class.error]="nameError"
            [(ngModel)]="formPermission.name"
            placeholder="e.g., View Users"
            maxlength="100"
          />
          <div class="error-message" *ngIf="nameError">{{ nameError }}</div>
        </div>

        <div class="form-group">
          <label for="permissionCode">Code <span class="required">*</span></label>
          <input 
            type="text" 
            id="permissionCode"
            class="form-input" 
            [class.error]="codeError"
            [(ngModel)]="formPermission.code"
            placeholder="e.g., users.view"
            maxlength="100"
          />
          <div class="error-message" *ngIf="codeError">{{ codeError }}</div>
          <div class="form-hint">Format: module.action (e.g., users.view, tasks.create)</div>
        </div>

        <div class="form-group">
          <label for="permissionDescription">Description</label>
          <textarea 
            id="permissionDescription"
            class="form-input" 
            [(ngModel)]="formPermission.description"
            placeholder="Permission description..."
            rows="3"
            maxlength="500"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="permissionModule">Module</label>
          <input 
            type="text" 
            id="permissionModule"
            class="form-input" 
            [(ngModel)]="formPermission.module"
            placeholder="e.g., Users, Tasks, Budget"
            maxlength="100"
            list="modules-list"
          />
          <datalist id="modules-list">
            <option *ngFor="let module of modules" [value]="module"></option>
          </datalist>
        </div>

        <div class="form-group form-group-checkbox">
          <label for="permissionActive" class="form-label-inline">Active</label>
          <label class="checkbox-label">
            <input 
              type="checkbox" 
              id="permissionActive"
              [(ngModel)]="formPermission.is_active"
              class="checkbox-input"
            />
            <span class="checkbox-toggle">
              <span class="toggle-indicator"></span>
            </span>
          </label>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        <button class="btn btn-primary" (click)="savePermission()">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </div>
  </div>
</div>
