<div class="user-management-container">
  <!-- Search and Add Button Row -->
  <div class="master-toolbar" *ngIf="tableConfig.searchable">
    <div class="master-search-wrapper">
      <input 
        type="text" 
        class="master-search-input" 
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange()"
        placeholder="Search users..."
      />
      <button 
        *ngIf="searchQuery" 
        class="master-search-clear"
        (click)="searchQuery = ''; onSearchChange()"
        title="Clear search"
      >
        <i class="fas fa-times"></i>
      </button>
    </div>
    <button 
      class="add-action-btn" 
      (click)="openAddModal()"
      aria-label="Add new user"
      title="Create a new user"
    >
      <i class="fas fa-plus icon" [attr.aria-hidden]="true"></i>
      <span class="label">Add User</span>
    </button>
  </div>

  <!-- Table View -->
  <div class="table-view">
    <app-data-table
      [columns]="tableColumns"
      [data]="getTableData()"
      [config]="tableConfig"
      [actions]="tableActions"
      [loading]="false"
      emptyMessage="No users available"
      searchPlaceholder="Search users..."
      [externalSearch]="searchQuery"
      (rowClick)="onTableRowClick($event)"
      (actionClick)="onTableActionClick($event)"
      (sortChange)="onTableSortChange($event)"
      (filterChange)="onTableFilterChange($event)"
      (pageChange)="onTablePageChange($event)"
    ></app-data-table>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" *ngIf="showAddEditModal" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ isEditMode ? 'Edit User' : 'Add New User' }}</h3>
        <button class="btn-icon" (click)="closeModal()" title="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="userEmail">Email <span class="required">*</span></label>
          <input 
            type="email" 
            id="userEmail"
            class="form-input" 
            [class.error]="emailError"
            [(ngModel)]="formUser.email"
            placeholder="user@example.com"
            maxlength="255"
          />
          <div class="error-message" *ngIf="emailError">{{ emailError }}</div>
        </div>

        <div class="form-group">
          <label for="userUsername">Username <span class="required">*</span></label>
          <input 
            type="text" 
            id="userUsername"
            class="form-input" 
            [class.error]="usernameError"
            [(ngModel)]="formUser.username"
            placeholder="username"
            maxlength="100"
          />
          <div class="error-message" *ngIf="usernameError">{{ usernameError }}</div>
        </div>

        <div class="form-group" *ngIf="!isEditMode">
          <label for="userPassword">Password <span class="required">*</span></label>
          <input 
            type="password" 
            id="userPassword"
            class="form-input" 
            [class.error]="passwordFormError"
            [(ngModel)]="formUser.password"
            placeholder="Minimum 6 characters"
          />
          <div class="error-message" *ngIf="passwordFormError">{{ passwordFormError }}</div>
        </div>

        <div class="form-group">
          <label for="userFirstName">First Name <span class="required">*</span></label>
          <input 
            type="text" 
            id="userFirstName"
            class="form-input" 
            [class.error]="firstNameError"
            [(ngModel)]="formUser.first_name"
            placeholder="First Name"
            maxlength="100"
          />
          <div class="error-message" *ngIf="firstNameError">{{ firstNameError }}</div>
        </div>

        <div class="form-group">
          <label for="userLastName">Last Name <span class="required">*</span></label>
          <input 
            type="text" 
            id="userLastName"
            class="form-input" 
            [class.error]="lastNameError"
            [(ngModel)]="formUser.last_name"
            placeholder="Last Name"
            maxlength="100"
          />
          <div class="error-message" *ngIf="lastNameError">{{ lastNameError }}</div>
        </div>

        <div class="form-group">
          <label for="userPhone">Phone</label>
          <input 
            type="tel" 
            id="userPhone"
            class="form-input" 
            [class.error]="phoneError"
            [(ngModel)]="formUser.phone"
            placeholder="+1234567890"
            maxlength="20"
          />
          <div class="error-message" *ngIf="phoneError">{{ phoneError }}</div>
        </div>

        <div class="form-group">
          <label>Roles</label>
          <div class="roles-selection">
            <div 
              *ngFor="let role of roles" 
              class="role-checkbox-item"
            >
              <label class="checkbox-label">
                <input 
                  type="checkbox"
                  [checked]="isRoleSelected(role.id)"
                  (change)="toggleRoleSelection(role.id)"
                  class="checkbox-input"
                />
                <span class="checkbox-toggle">
                  <span class="toggle-indicator"></span>
                </span>
                <span class="role-name">{{ role.name }}</span>
                <span class="role-description" *ngIf="role.description">{{ role.description }}</span>
              </label>
            </div>
            <div class="no-roles-message" *ngIf="roles.length === 0">
              No active roles available
            </div>
          </div>
        </div>

        <div class="form-group form-group-checkbox">
          <label for="userActive" class="form-label-inline">Active</label>
          <label class="checkbox-label">
            <input 
              type="checkbox" 
              id="userActive"
              [(ngModel)]="formUser.is_active"
              class="checkbox-input"
            />
            <span class="checkbox-toggle">
              <span class="toggle-indicator"></span>
            </span>
          </label>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        <button class="btn btn-primary" (click)="saveUser()">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </div>
  </div>

  <!-- Change Password Modal -->
  <div class="modal-overlay" *ngIf="showPasswordModal" (click)="closePasswordModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>Change Password</h3>
        <button class="btn-icon" (click)="closePasswordModal()" title="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="newPassword">New Password <span class="required">*</span></label>
          <input 
            type="password" 
            id="newPassword"
            class="form-input" 
            [class.error]="passwordError"
            [(ngModel)]="newPassword"
            placeholder="Minimum 6 characters"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
          <input 
            type="password" 
            id="confirmPassword"
            class="form-input" 
            [class.error]="passwordError"
            [(ngModel)]="confirmPassword"
            placeholder="Re-enter password"
          />
          <div class="error-message" *ngIf="passwordError">{{ passwordError }}</div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closePasswordModal()">Cancel</button>
        <button class="btn btn-primary" (click)="changePassword()">
          Change Password
        </button>
      </div>
    </div>
  </div>
</div>
